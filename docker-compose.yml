version: "3.9"

services:
  db:
    image: mysql:8
    container_name: inventory-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: inventory-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"   # AMQP protocol port (app connections)
      - "15672:15672" # Management UI — http://localhost:15672 (guest/guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    container_name: inventory-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: inventory-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: inventory-jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # Jaeger UI — http://localhost:16686
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver (what this project's exporters use)

  api:
    build: .
    container_name: inventory-api
    restart: unless-stopped
    command: node server.js
    ports:
      - "${PORT:-3000}:3000"
    environment: &common_env
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      PORT: 3000
      NODE_ENV: ${NODE_ENV:-development}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      RETRY_MAX_ATTEMPTS: ${RETRY_MAX_ATTEMPTS:-5}
      RETRY_BASE_DELAY_MS: ${RETRY_BASE_DELAY_MS:-2000}
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB_NAME: ${MONGO_DB_NAME:-inventory_order_readmodel}
      REDIS_URL: redis://redis:6379
      RATE_LIMIT_API_CAPACITY: ${RATE_LIMIT_API_CAPACITY:-20}
      RATE_LIMIT_API_REFILL_PER_SEC: ${RATE_LIMIT_API_REFILL_PER_SEC:-5}
      RATE_LIMIT_AUTH_CAPACITY: ${RATE_LIMIT_AUTH_CAPACITY:-5}
      RATE_LIMIT_AUTH_REFILL_PER_SEC: ${RATE_LIMIT_AUTH_REFILL_PER_SEC:-1}
      RATE_LIMIT_ORDER_CREATE_CAPACITY: ${RATE_LIMIT_ORDER_CREATE_CAPACITY:-10}
      RATE_LIMIT_ORDER_CREATE_REFILL_PER_SEC: ${RATE_LIMIT_ORDER_CREATE_REFILL_PER_SEC:-2}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      jaeger:
        condition: service_started

  worker:
    build: .
    container_name: inventory-worker
    restart: unless-stopped
    command: node worker.js
    environment: *common_env
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      jaeger:
        condition: service_started

  sync-worker:
    build: .
    container_name: inventory-sync-worker
    restart: unless-stopped
    command: node syncWorker.js
    environment: *common_env
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongo:
        condition: service_healthy
      jaeger:
        condition: service_started

volumes:
  db_data:
  mongo_data:
